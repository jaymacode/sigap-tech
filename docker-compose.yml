services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sigap']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Menunggu MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb --ignore-existing local/sigap-attachments;
      /usr/bin/mc anonymous set download local/sigap-attachments;
      echo 'Bucket sigap-attachments siap.';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
      - '1025:1025'

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    # Migrasi SQL nyata (db/migrations), advisory lock 727001. Data demo tidak ditulis di sini:
    # container web yang mengisi database kosong saat boot pertama (lihat scripts/seed.js).
    command: ['node', 'scripts/migrate.js']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - '${SIGAP_PORT:-3000}:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_VERSION: ${SIGAP_VERSION:-1.0.0}
      DEMO_MODE: ${DEMO_MODE:-true}
      AUTH_SECRET: ${AUTH_SECRET:-local-only-not-secret-change-in-prod}
      CHANGE_WEBHOOK_TOKEN: ${CHANGE_WEBHOOK_TOKEN:-local-change-token}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
      SIGAP_WEB_URL: http://web:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ['node', 'scripts/worker.js']
    environment:
      NODE_ENV: production
      SIGAP_WEB_URL: http://web:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
    healthcheck:
      test: ['CMD', 'pidof', 'node']
      interval: 15s
      timeout: 5s
      retries: 3

  # Menjalankan semua tes (unit + integrasi Postgres) di dalam container.
  # Pemakaian: docker compose --profile test run --rm test
  test:
    profiles: ['test']
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: test
      CI: 'true'
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/sigap_test
    # Buat database sigap_test bila belum ada (tidak pernah menyentuh database sigap), lalu jalankan vitest.
    command:
      - sh
      - -c
      - |
        node -e 'const {Client}=require("pg");(async()=>{const u=new URL(process.env.TEST_DATABASE_URL);u.pathname="/postgres";const c=new Client({connectionString:u.toString()});await c.connect();try{const r=await c.query("SELECT 1 FROM pg_database WHERE datname = \x27sigap_test\x27");if(r.rowCount===0){await c.query("CREATE DATABASE sigap_test");console.log("[sigap-test] database sigap_test dibuat")}}finally{await c.end()}})().catch(e=>{console.error(e.message);process.exit(1)})' && pnpm vitest run

volumes:
  pgdata:
  miniodata:
