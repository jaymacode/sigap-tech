services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-sigap}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d sigap']
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: elestio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    ports:
      - '${MINIO_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: elestio/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo 'Menunggu MinIO...'
        sleep 1
      done;
      /usr/bin/mc mb --ignore-existing local/sigap-attachments;
      /usr/bin/mc anonymous set download local/sigap-attachments;
      echo 'Bucket sigap-attachments siap.';
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '${MAILPIT_PORT:-8025}:8025'
      - '1025:1025'

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
    command: ['/bin/sh', '-c', 'node scripts/migrate.js && node scripts/seed.js --if-empty']
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
    healthcheck:
      disable: true

  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    ports:
      - '${SIGAP_PORT:-3000}:3000'
    environment:
      PORT: 3000
      NODE_ENV: production
      APP_VERSION: ${SIGAP_VERSION:-1.0.0}
      DEMO_MODE: ${DEMO_MODE:-true}
      AUTH_SECRET: ${AUTH_SECRET:-local-only-not-secret-change-in-prod}
      CHANGE_WEBHOOK_TOKEN: ${CHANGE_WEBHOOK_TOKEN:-local-change-token}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
      SIGAP_WEB_URL: http://web:3000
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SIGAP_IMAGE:-ghcr.io/sigap/sigap}:${SIGAP_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    command: ['node', 'scripts/worker.js']
    environment:
      NODE_ENV: production
      SIGAP_WEB_URL: http://web:3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sigap}
    healthcheck:
      test: ['CMD', 'pidof', 'node']
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  miniodata:
