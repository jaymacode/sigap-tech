# Local PostgreSQL for trying DB_DRIVER=postgres / running tests/postgres.test.ts.
#   docker compose -f docker-compose.postgres.yml up -d
#   DB_DRIVER=postgres DATABASE_URL=postgres://sigap:sigap@localhost:5432/sigap bun run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sigap
      POSTGRES_PASSWORD: sigap
      POSTGRES_DB: sigap
    ports:
      - '5432:5432'
    volumes:
      - sigap-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sigap -d sigap']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  sigap-pg:
